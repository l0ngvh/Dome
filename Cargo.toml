[workspace]
resolver = "3"
# Workspace verification needs --workspace to include every member.
default-members = ["crates/dome"]
members = ["crates/dome", "crates/dome-core", "crates/dome-bar", "crates/dome-ipc"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.148"
anyhow = "1.0.103"
# Newer async-trait releases trigger an LLVM branch-coverage crash on our nightly.
# https://github.com/rust-lang/rust/issues/157358
# Unpin when `cargo make coverage` succeeds with the newer release.
async-trait = "=0.1.88"
interprocess = "2.2.3"

[profile.release]
debug = "line-tables-only"

[profile.test]
opt-level = 2
