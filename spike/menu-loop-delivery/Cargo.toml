# An empty workspace table detaches this spike from the Dome workspace, so it builds on its own
# and can be deleted without touching the main crate.
[workspace]

[package]
name = "menu-loop-delivery-spike"
version = "0.0.0"
edition = "2024"
publish = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
