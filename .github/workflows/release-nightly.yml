name: release-nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      date: ${{ steps.version.outputs.date }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      full_sha: ${{ steps.version.outputs.full_sha }}
    steps:
      - uses: actions/checkout@v4

      # Computed here rather than in publish so a run that straddles midnight UTC
      # cannot tag itself with a different date than it gated on.
      - name: compute-version
        id: version
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          DATE=$(date -u +%Y.%m.%d)
          echo "short_sha=$SHORT_SHA"          >> "$GITHUB_OUTPUT"
          echo "full_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$DATE"                    >> "$GITHUB_OUTPUT"
          echo "version=$DATE.$SHORT_SHA"      >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$DATE.$SHORT_SHA"  >> "$GITHUB_OUTPUT"

      - name: check-head
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          LAST_SHA=$(gh release view nightly --json body -q .body 2>/dev/null \
            | grep -oE 'sha=[a-f0-9]{40}$' | head -1 | cut -d= -f2 || true)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG is already published. A rebuild of the same commit on the same day would publish different bytes under a version that is already taken."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$LAST_SHA" ] || [ "$HEAD_SHA" != "$LAST_SHA" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build-${{matrix.target}}
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dome-nightly-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dome-nightly-aarch64-apple-darwin.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{matrix.target}}

      - name: install cargo-make
        run: cargo install cargo-make --locked

      - name: import-signing-cert
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "No signing cert configured; nightly will be ad-hoc signed."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/dome-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: build-windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release --target ${{matrix.target}}
          Compress-Archive -Force "target/${{matrix.target}}/release/dome.exe","target/${{matrix.target}}/release/dome.pdb" ${{matrix.artifact}}

      - name: build-macos
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          BUNDLE_TARGET: ${{matrix.target}}
          DOME_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          cargo build --release --target ${{matrix.target}}
          cargo make bundle
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          mv "target/Dome-${CARGO_VERSION}.dmg" "${{matrix.artifact}}"

      - name: verify-codesign
        if: matrix.os == 'macos-latest'
        env:
          DOME_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$DOME_SIGNING_IDENTITY" ]; then
            echo "::warning::No MACOS_SIGNING_IDENTITY; nightly is ad-hoc signed and TCC grants will not persist."
            exit 0
          fi
          codesign -dv --verbose=4 target/bundle/Dome.app 2>&1 | tee /tmp/codesign-out
          if ! grep -qF "Authority=$DOME_SIGNING_IDENTITY" /tmp/codesign-out; then
            echo "::error::Dome.app is not signed with '$DOME_SIGNING_IDENTITY'."
            exit 1
          fi
          codesign --verify --strict --verbose=2 target/bundle/Dome.app

      - name: cleanup-keychain
        if: matrix.os == 'macos-latest' && always()
        run: |
          security delete-keychain "$RUNNER_TEMP/dome-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: dome-nightly-${{matrix.target}}
          path: ${{matrix.artifact}}

  build-raycast-extension:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: integrations/raycast/.nvmrc
          cache: npm
          cache-dependency-path: integrations/raycast/package-lock.json
      - name: install-deps
        working-directory: integrations/raycast
        run: npm ci
      - name: build
        working-directory: integrations/raycast
        run: npm run build
      - name: package
        run: |
          cd integrations/raycast
          zip -r ../../dome-nightly-raycast-extension.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: dome-nightly-raycast-extension
          path: dome-nightly-raycast-extension.zip

  build-flow-launcher-plugin:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install-deps
        run: pip install -r integrations/flow-launcher/requirements.txt -t integrations/flow-launcher/lib
      - name: package
        run: |
          cd integrations
          zip -r ../dome-nightly-flow-launcher-plugin.zip flow-launcher \
            -x '*/__pycache__/*' -x '*.pyc'
      - uses: actions/upload-artifact@v4
        with:
          name: dome-nightly-flow-launcher-plugin
          path: dome-nightly-flow-launcher-plugin.zip

  publish:
    name: publish-nightly
    needs: [gate, build, build-raycast-extension, build-flow-launcher-plugin]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
      DATE: ${{ needs.gate.outputs.date }}
      SHORT_SHA: ${{ needs.gate.outputs.short_sha }}
      FULL_SHA: ${{ needs.gate.outputs.full_sha }}
      KEEP_NIGHTLIES: "14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Package managers pin a sha256, so the URL they fetch has to be immutable.
      # One copy carries the version in its name for the versioned release, the
      # other keeps the stable name on the rolling release for manual downloads
      # and the integration READMEs.
      - name: stage-artifacts
        run: |
          set -euo pipefail
          mkdir -p versioned rolling
          stage() {
            cp "dist/$1/$2" "rolling/$2"
            cp "dist/$1/$2" "versioned/${2/dome-nightly-/dome-nightly-$VERSION-}"
          }
          stage dome-nightly-aarch64-apple-darwin   dome-nightly-aarch64-apple-darwin.dmg
          stage dome-nightly-x86_64-pc-windows-msvc dome-nightly-x86_64-pc-windows-msvc.zip
          stage dome-nightly-raycast-extension      dome-nightly-raycast-extension.zip
          stage dome-nightly-flow-launcher-plugin   dome-nightly-flow-launcher-plugin.zip

      - name: compute-sha
        id: sha
        run: |
          set -euo pipefail
          echo "sha_aarch64_dmg=$(sha256sum "versioned/dome-nightly-$VERSION-aarch64-apple-darwin.dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_zip=$(sha256sum "versioned/dome-nightly-$VERSION-x86_64-pc-windows-msvc.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Ordered before the rolling refresh so a failure there still leaves the
      # taps resolving against a complete versioned release.
      - name: create-versioned-release
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "Dome Nightly $DATE ($SHORT_SHA)" \
            --notes "Nightly build at $DATE UTC. sha=$FULL_SHA" \
            --prerelease \
            --target "$FULL_SHA" \
            versioned/*

      - name: refresh-rolling-release
        run: |
          set -euo pipefail
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --title "Dome Nightly $DATE ($SHORT_SHA)" \
            --notes "Latest nightly: $TAG. These assets always track the newest build, so their checksums change in place. Package managers must pin the versioned assets on $TAG instead. sha=$FULL_SHA" \
            --prerelease \
            --target "$FULL_SHA" \
            rolling/*

      # A tap can lag the newest release by up to HOMEBREW_AUTO_UPDATE_SECS, so
      # retention has to outlive that window by a wide margin. Count-based rather
      # than age-based because the gate skips days with no new commits.
      - name: prune-old-nightlies
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.createdAt) | reverse | .[].tagName' \
            > nightly-tags.txt
          tail -n "+$((KEEP_NIGHTLIES + 1))" nightly-tags.txt | while read -r stale; do
            [ -n "$stale" ] || continue
            echo "Deleting $stale"
            gh release delete "$stale" --cleanup-tag --yes
          done

      - name: dispatch-homebrew
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          repository: l0ngvh/homebrew-dome
          event-type: new-nightly-release
          client-payload: >-
            {"version": "${{ needs.gate.outputs.version }}",
             "sha_aarch64_dmg": "${{ steps.sha.outputs.sha_aarch64_dmg }}",
             "sha_zip": "${{ steps.sha.outputs.sha_zip }}"}

      - name: dispatch-scoop
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          repository: l0ngvh/scoop-dome
          event-type: new-nightly-release
          client-payload: >-
            {"version": "${{ needs.gate.outputs.version }}",
             "sha_aarch64_dmg": "${{ steps.sha.outputs.sha_aarch64_dmg }}",
             "sha_zip": "${{ steps.sha.outputs.sha_zip }}"}
