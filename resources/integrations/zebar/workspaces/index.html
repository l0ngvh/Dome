<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        network: { type: 'network' },
        cpu: { type: 'cpu' },
        date: { type: 'date', formatting: 'EEE d MMM t' },
        battery: { type: 'battery' },
        memory: { type: 'memory' },
        weather: { type: 'weather' },
      });

      const isNumericName = (value) => /^[+-]?\d+$/.test(value);

      function byName(left, right) {
        const leftIsNumeric = isNumericName(left.name);
        const rightIsNumeric = isNumericName(right.name);
        if (leftIsNumeric !== rightIsNumeric) return leftIsNumeric ? -1 : 1;
        if (leftIsNumeric) return parseInt(left.name, 10) - parseInt(right.name, 10);
        return left.name < right.name ? -1 : left.name > right.name ? 1 : 0;
      }

      async function getDeviceName() {
        try {
          const widget =
            typeof zebar.currentWidget === 'function'
              ? zebar.currentWidget()
              : zebar.currentWidget;
          if (widget?.window?.tauri?.currentMonitor) {
            const monitor = await widget.window.tauri.currentMonitor();
            if (monitor?.name) return monitor.name;
          }
          if (widget?.tauriWindow?.currentMonitor) {
            const monitor = await widget.tauriWindow.currentMonitor();
            if (monitor?.name) return monitor.name;
          }
        } catch {}
        try {
          const { currentMonitor } = await import(
            'https://esm.sh/@tauri-apps/api@2/window.mjs'
          );
          const monitor = await currentMonitor();
          if (monitor?.name) return monitor.name;
        } catch {}
        return null;
      }

      function filterByMonitor(data, monitorName) {
        if (!monitorName) {
          return data.filter((entry) => entry.state === 'Attached').sort(byName);
        }
        return data
          .filter((entry) => entry.state === 'Attached' && entry.monitor === monitorName)
          .sort(byName);
      }

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        const [output, setOutput] = useState(providers.outputMap);
        const [workspaces, setWorkspaces] = useState([]);
        const [parked, setParked] = useState([]);
        const monitorName = useRef(null);
        const focusWorkspace = useRef(() => {});

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        useEffect(() => {
          async function resolveMonitor() {
            const device = await getDeviceName();
            if (!device) return;
            try {
              const res = await zebar.shellExec('dome', ['query', 'monitors']);
              const rows = JSON.parse(res.stdout.trim());
              if (!Array.isArray(rows)) return;
              const match = rows.find((row) => row.gdi_device === device);
              monitorName.current = match ? match.unique_name : null;
            } catch {}
          }

          async function refresh() {
            if (monitorName.current === null) await resolveMonitor();
            try {
              const res = await zebar.shellExec('dome', ['query', 'workspaces']);
              const data = JSON.parse(res.stdout.trim());
              if (!Array.isArray(data)) return;
              let rows = filterByMonitor(data, monitorName.current);
              if (monitorName.current !== null && rows.length === 0) {
                await resolveMonitor();
                rows = filterByMonitor(data, monitorName.current);
              }
              setWorkspaces(rows);
              setParked(
                data
                  .filter((entry) => entry.state === 'Parked' && entry.window_count > 0)
                  .sort(byName),
              );
            } catch {}
          }

          focusWorkspace.current = async (name, monitor) => {
            try {
              await zebar.shellExec('dome', ['focus', 'workspace', name, '--monitor', monitor]);
              await refresh();
            } catch {}
          };

          refresh();
          const id = setInterval(refresh, 1000);
          return () => clearInterval(id);
        }, []);

        function getNetworkIcon(networkOutput) {
          switch (networkOutput.defaultInterface?.type) {
            case 'ethernet':
              return <i className="nf nf-md-ethernet_cable"></i>;
            case 'wifi':
              if (networkOutput.defaultGateway?.signalStrength >= 80)
                return <i className="nf nf-md-wifi_strength_4"></i>;
              if (networkOutput.defaultGateway?.signalStrength >= 65)
                return <i className="nf nf-md-wifi_strength_3"></i>;
              if (networkOutput.defaultGateway?.signalStrength >= 40)
                return <i className="nf nf-md-wifi_strength_2"></i>;
              if (networkOutput.defaultGateway?.signalStrength >= 25)
                return <i className="nf nf-md-wifi_strength_1"></i>;
              return <i className="nf nf-md-wifi_strength_outline"></i>;
            default:
              return <i className="nf nf-md-wifi_strength_off_outline"></i>;
          }
        }

        function getBatteryIcon(batteryOutput) {
          if (batteryOutput.chargePercent > 90)
            return <i className="nf nf-fa-battery_4"></i>;
          if (batteryOutput.chargePercent > 70)
            return <i className="nf nf-fa-battery_3"></i>;
          if (batteryOutput.chargePercent > 40)
            return <i className="nf nf-fa-battery_2"></i>;
          if (batteryOutput.chargePercent > 20)
            return <i className="nf nf-fa-battery_1"></i>;
          return <i className="nf nf-fa-battery_0"></i>;
        }

        function getWeatherIcon(weatherOutput) {
          switch (weatherOutput.status) {
            case 'clear_day':
              return <i className="nf nf-weather-day_sunny"></i>;
            case 'clear_night':
              return <i className="nf nf-weather-night_clear"></i>;
            case 'cloudy_day':
              return <i className="nf nf-weather-day_cloudy"></i>;
            case 'cloudy_night':
              return <i className="nf nf-weather-night_alt_cloudy"></i>;
            case 'light_rain_day':
              return <i className="nf nf-weather-day_sprinkle"></i>;
            case 'light_rain_night':
              return <i className="nf nf-weather-night_alt_sprinkle"></i>;
            case 'heavy_rain_day':
              return <i className="nf nf-weather-day_rain"></i>;
            case 'heavy_rain_night':
              return <i className="nf nf-weather-night_alt_rain"></i>;
            case 'snow_day':
              return <i className="nf nf-weather-day_snow"></i>;
            case 'snow_night':
              return <i className="nf nf-weather-night_alt_snow"></i>;
            case 'thunder_day':
              return <i className="nf nf-weather-day_lightning"></i>;
            case 'thunder_night':
              return <i className="nf nf-weather-night_alt_lightning"></i>;
          }
        }

        return (
          <div className="app">
            <div className="left">
              <div className="workspaces">
                {workspaces.map((entry) => {
                  if (!entry.is_focused && !entry.is_visible && entry.window_count === 0)
                    return null;
                  return (
                    <span
                      key={entry.name}
                      className={entry.is_focused ? 'ws focused' : 'ws'}
                      onClick={() => focusWorkspace.current(entry.name, entry.monitor)}
                    >
                      {entry.name}
                    </span>
                  );
                })}
                {parked.length > 0 && (
                  <span className="parked-group">
                    <span className="parked-label">parked</span>
                    {parked.map((entry) => (
                      <span
                        key={`${entry.monitor}::${entry.name}`}
                        className="ws parked"
                        title={`return ${entry.name} to ${entry.monitor}`}
                        onClick={() => focusWorkspace.current(entry.name, entry.monitor)}
                      >
                        {entry.name}
                      </span>
                    ))}
                  </span>
                )}
              </div>
            </div>

            <div className="center">
              {output.date?.formatted && (
                <span className="date">{output.date.formatted}</span>
              )}
            </div>

            <div className="right">
              {output.network && (
                <div className="network">
                  {getNetworkIcon(output.network)}
                  {output.network.defaultGateway?.ssid}
                </div>
              )}
              {output.memory && (
                <div className="memory">
                  <i className="nf nf-fae-chip"></i>
                  {Math.round(output.memory.usage)}%
                </div>
              )}
              {output.cpu && (
                <div className="cpu">
                  <i className="nf nf-oct-cpu"></i>
                  <span className={output.cpu.usage > 85 ? 'high-usage' : ''}>
                    {Math.round(output.cpu.usage)}%
                  </span>
                </div>
              )}
              {output.battery && (
                <div className="battery">
                  {output.battery.isCharging && (
                    <i className="nf nf-md-power_plug charging-icon"></i>
                  )}
                  {getBatteryIcon(output.battery)}
                  {Math.round(output.battery.chargePercent)}%
                </div>
              )}
              {output.weather && (
                <div className="weather">
                  {getWeatherIcon(output.weather)}
                  {Math.round(output.weather.celsiusTemp)}°C
                </div>
              )}
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
